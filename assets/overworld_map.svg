<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="100%" height="100%" fill="#1b3b2f"/>
  <!-- Simple map: TownA -->
  <circle cx="80" cy="120" r="12" fill="#f4d35e" stroke="#000" stroke-width="2"/>
  <text x="100" y="120" fill="#fff" font-size="12">TownA</text>
  <!-- Crossroads -->
  <circle cx="200" cy="100" r="10" fill="#f08a5d" stroke="#000" stroke-width="2"/>
  <text x="220" y="100" fill="#fff" font-size="12">Crossroads</text>
  <!-- Forest -->
  <circle cx="340" cy="180" r="10" fill="#6f9e6e" stroke="#000" stroke-width="2"/>
  <text x="360" y="180" fill="#fff" font-size="12">Forest</text>
  <!-- BanditCamp -->
  <circle cx="520" cy="160" r="12" fill="#b44d4d" stroke="#000" stroke-width="2"/>
  <text x="542" y="160" fill="#fff" font-size="12">BanditCamp</text>
  <!-- connections -->
  <line x1="92" y1="120" x2="190" y2="108" stroke="#e7e7e7" stroke-width="2" />
  <line x1="210" y1="100" x2="330" y2="172" stroke="#e7e7e7" stroke-width="2" />
  <line x1="352" y1="180" x2="508" y2="168" stroke="#e7e7e7" stroke-width="2" />
</svg>
