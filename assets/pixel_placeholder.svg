<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Simple 8x8 pixel character (each rect = 4x4) -->
  <rect width="32" height="32" fill="#000000" />
  <!-- face -->
  <rect x="8" y="4" width="16" height="8" fill="#f8d7a8" />
  <!-- hair -->
  <rect x="8" y="2" width="16" height="4" fill="#2f1b0c" />
  <!-- body -->
  <rect x="10" y="12" width="12" height="12" fill="#6a9b4f" />
  <!-- belt -->
  <rect x="10" y="18" width="12" height="2" fill="#4a2f1b" />
  <!-- eyes -->
  <rect x="12" y="8" width="2" height="2" fill="#000" />
  <rect x="18" y="8" width="2" height="2" fill="#000" />
</svg>
